# Render Blueprint — one FREE web service runs the API + BullMQ worker + Telegram (RUN_WORKER=true).
# Database: Supabase (DATABASE_URL = Supabase "Session pooler" connection string).
# Redis: Redis Cloud free database (REDIS_URL = redis://default:<password>@<host>:<port>).
# Values marked sync:false are entered in the Render dashboard — never commit them.
services:
  - type: web
    name: wishluck-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js --if-empty && node dist/src/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: "true"
      - key: TELEGRAM_MODE
        value: webhook
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: ORDER_WEBHOOK_SECRET
        generateValue: true
      - key: COURIER_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TEAM_TELEGRAM_CHAT_ID
        sync: false
      - key: PUBLIC_API_URL
        sync: false # https://wishluck-api.onrender.com (this service's own URL)
      - key: WEB_URL
        sync: false # https://<your-site>.netlify.app
      - key: CORS_ORIGIN
        sync: false # https://<your-site>.netlify.app
